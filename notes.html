<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app container">
      <div class="popup-box box">
        <div class="popup">
          <div class="content">
            <header>
              <p></p>
              <i class="uil uil-times close-icon"></i>
            </header>
            <form action="#">
              <div class="row title">
                <label>Title</label>
                <input
                  type="text"
                  spellcheck="false"
                  placeholder="Enter title"
                />
              </div>
              <div class="row description">
                <label>Description</label>
                <textarea
                  spellcheck="false"
                  placeholder="Enter description"
                ></textarea>
              </div>
              <button type="button">Add note</button>
            </form>
          </div>
        </div>
      </div>
      <ul class="wrepper">
        <li class="add-box box">
          <div class="icon"><i class="uil uil-plus"></i></div>
          <p>Add a new note</p>
        </li>
      </ul>
      <footer class="footer">
        <p>
          made by
          <a href="https://by me.com" target="_blank" class="footer link"
            >by me</a
          >
        </p>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
